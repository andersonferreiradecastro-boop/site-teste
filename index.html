<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Testes - Anderson</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      text-align: center;
    }
    header {
      background-color: #0b2545;
      color: white;
      padding: 40px 20px;
    }
    h1 {
      margin: 0 0 10px 0;
    }
    .botao {
      display: inline-block;
      background-color: #25d366;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      margin-top: 20px;
    }
    .caixa {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <header>
    <h1>Meu Laboratório de Testes</h1>
    <p>Aqui eu posso testar cores, textos e botões à vontade</p>
    <a href="#" class="botao">Botão de Exemplo</a>
  </header>

  <div class="caixa">
    <h2>Bloco de Conteúdo</h2>
    <p>Este é um card branco no meio da tela. Depois podemos mudar a cor dele ou colocar fotos aqui.</p>
  </div>

</body>
</html>
